<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Pro - Controle de Ponto</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ponto.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="TG Pro Logo" class="nav-logo">
            <span>Controle de Ponto</span>
        </div>
        <div class="nav-links">
            <span id="userEmail" class="user-email-badge">Carregando...</span>
            <a href="painel.html" class="nav-item">⬅ Voltar ao Painel</a>
        </div>
    </nav>

    <div class="container">
        
        <div class="toolbar-section">
            <div class="toolbar-filters">
                <div class="input-wrapper">
                    <label>Colaborador</label>
                    <select id="filterUser" class="form-control">
                        <option value="">Todos os Colaboradores</option>
                    </select>
                </div>
                <div class="input-wrapper">
                    <label>Mês/Ano</label>
                    <input type="month" id="filterMonth" class="form-control">
                </div>
            </div>

            <div class="toolbar-actions">
                <button id="btnManualLaunch" class="btn-primary">+ Lançamento Manual</button>
            </div>
        </div>

        <div class="card-table">
            <table class="tabela-padrao">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Colaborador</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th>Status</th>
                        <th>Obs</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="pontoBody">
                    <tr><td colspan="7" style="text-align: center;">Carregando registros de ponto...</td></tr>
                </tbody>
            </table>
        </div>

    </div>

    <div id="modalPonto" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Lançamento de Ponto</h2>
            </div>
            
            <form id="formPonto">
                <input type="hidden" id="pontoId">
                
                <div class="form-group">
                    <label>Colaborador *</label>
                    <select id="inpUser" class="form-control" required></select>
                </div>

                <div class="row-dupla">
                    <div class="form-group" style="flex: 1;">
                        <label>Data *</label>
                        <input type="date" id="inpDate" class="form-control" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Tipo de Registro *</label>
                        <select id="inpStatus" class="form-control" required>
                            <option value="Trabalho">Trabalho Normal</option>
                            <option value="Folga">Folga</option>
                            <option value="Descanso">Descanso</option>
                            <option value="Feriado">Feriado</option>
                            <option value="Falta">Falta</option>
                            <option value="Atestado">Atestado</option>
                            <option value="Ferias">Férias</option>
                        </select>
                    </div>
                </div>

                <div class="row-dupla" id="timeFields">
                    <div class="form-group" style="flex: 1;">
                        <label>Horário Entrada</label>
                        <input type="time" id="inpEntry" class="form-control">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Horário Saída</label>
                        <input type="time" id="inpExit" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label>Observações</label>
                    <textarea id="inpObs" rows="3" class="form-control" placeholder="Ex: Viagem, feriado trabalhado, etc..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" id="btnCancel" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script src="autoupdate.js"></script> 
    <script src="auth-guard.js"></script>
    <script type="module" src="ponto.js"></script>
</body>
</html>
