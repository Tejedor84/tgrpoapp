<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Clientes - TG Log</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="clientes.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="TG Pro" class="nav-logo">
            <span class="nav-title">Gestão de Clientes</span>
        </div>
        <div class="nav-links">
            <span id="user-email" class="user-email-badge">Carregando...</span>
            <a href="painel.html" class="nav-item">⬅ Voltar ao Painel</a>
        </div>
    </nav>


        <main class="page-container">
            
            <div class="form-container">
                <h3>Novo / Editar Cliente</h3>
                <input type="hidden" id="editId"> <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Nome da Empresa:</label>
                        <input type="text" id="inpEmpresa" placeholder="Razão Social ou Nome Fantasia">
                    </div>
                    <div class="form-group" style="flex: 3;">
                        <label>Endereço Completo:</label>
                        <input type="text" id="inpEndereco" placeholder="Rua, Número, Bairro, Cidade...">
                    </div>
                </div>

                <div class="contacts-section">
                    <div class="section-header">
                        <h4>Contatos da Empresa</h4>
                        <button class="btn-add-contact" onclick="adicionarLinhaContato()">+ Adicionar Contato</button>
                    </div>
                    
                    <div id="contactsList"></div>
                </div>

                <div class="form-actions">
                    <button id="btnSalvar" class="btn-primary">💾 Salvar Cliente</button>
                    <button id="btnCancelar" class="btn-secondary" style="display: none;">Cancelar Edição</button>
                </div>
            </div>

            <div class="list-container">
                <h3>Clientes Cadastrados</h3>
                <div class="search-bar">
                    <input type="text" id="inpBusca" placeholder="🔍 Buscar por nome da empresa...">
                </div>
                
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Empresa</th>
                            <th>Contatos</th>
                            <th>Endereço</th>
                            <th style="width: 100px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>

        </main>
    </div>

    <script src="autoupdate.js"></script>
    <script type="module" src="clientes.js"></script>
</body>
</html>
