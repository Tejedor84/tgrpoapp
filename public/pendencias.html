<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Log - Pendências</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="pendencias.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="TG Pro" class="nav-logo">
            <span class="nav-title">Quadro de Pendências</span>
        </div>
        <div class="nav-links">
            <span id="user-email" class="user-email-badge">Carregando...</span>
            <a href="painel.html" class="nav-item">⬅ Voltar ao Painel</a>
        </div>
    </nav>

    <div class="page-container">

        <div class="page-header">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Filtrar pendências...">
            </div>
            <button id="btnNewTask" class="btn-primary">+ Nova Pendência</button>
        </div>

        <div class="kanban-pendencias">
            <div class="k-column" id="col-todo">
                <div class="k-header header-todo">A Fazer 🔴</div>
                <div class="k-content" id="list-todo"></div>
            </div>
            <div class="k-column" id="col-doing">
                <div class="k-header header-doing">Em Andamento 🟡</div>
                <div class="k-content" id="list-doing"></div>
            </div>
            <div class="k-column" id="col-done">
                <div class="k-header header-done">Concluído 🟢</div>
                <div class="k-content" id="list-done"></div>
            </div>
        </div>

    </div>

    <!-- MODAL -->
    <div id="modalTask" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalTitle" style="color: #FFD700; margin-bottom: 20px;">Nova Tarefa</h3>

            <form id="formTask">
                <input type="hidden" id="taskId">

                <div class="input-group">
                    <label>Descrição da Tarefa</label>
                    <input type="text" id="taskDesc" required placeholder="Ex: Comprar cabos HDMI">
                </div>

                <div class="row-dupla">
                    <div class="input-group">
                        <label>Prioridade</label>
                        <select id="taskPriority">
                            <option value="Alta">Alta 🔥</option>
                            <option value="Media" selected>Média ⚠️</option>
                            <option value="Baixa">Baixa 🧊</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Responsável</label>
                        <input type="text" id="taskOwner" placeholder="Quem vai resolver?">
                    </div>
                </div>

                <div class="input-group">
                    <label>Status</label>
                    <select id="taskStatus">
                        <option value="todo">A Fazer</option>
                        <option value="doing">Em Andamento</option>
                        <option value="done">Concluído</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" id="btnCancel" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="autoupdate.js"></script>
    <script src="auth-guard.js"></script>
    <script type="module" src="pendencias.js"></script>
</body>
</html>
