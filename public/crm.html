<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Log - CRM</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="crm.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <img src="logo.png" alt="TG LOG" class="nav-logo">
            <span>Pipeline de Vendas</span>
        </div>
        <div class="nav-links">
            <span id="user-email" class="user-email-badge">Carregando...</span>
            <a href="painel.html" class="nav-item">⬅ Voltar ao Painel</a>
        </div>
    </nav>

    <div class="crm-controls">
        <button id="btnNewDeal" class="btn-primary">+ Nova Oportunidade</button>
    </div>

    <div class="kanban-board">
        <div class="kanban-column" id="col-prospeccao" data-status="Prospecção">
            <div class="column-header header-prospeccao">Prospecção</div>
            <div class="column-content"></div>
        </div>
        <div class="kanban-column" id="col-qualificacao" data-status="Qualificação">
            <div class="column-header header-qualificacao">Qualificação</div>
            <div class="column-content"></div>
        </div>
        <div class="kanban-column" id="col-proposta" data-status="Proposta">
            <div class="column-header header-proposta">Proposta Enviada</div>
            <div class="column-content"></div>
        </div>
        <div class="kanban-column" id="col-negociacao" data-status="Negociação">
            <div class="column-header header-negociacao">Negociação</div>
            <div class="column-content"></div>
        </div>
        <div class="kanban-column" id="col-fechado" data-status="Fechado">
            <div class="column-header header-fechado">Fechado / Ganho</div>
            <div class="column-content"></div>
        </div>
    </div>

    <div id="modalDeal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close-btn">&times;</span>
            <h3 id="modalTitle" style="color: var(--primary-color); margin-bottom: 20px;">Nova Oportunidade</h3>
            
            <form id="formDeal">
                <input type="hidden" id="dealId">

                <div class="input-group">
                    <label>Título / Cliente *</label>
                    <input type="text" id="dealTitle" class="form-control" required placeholder="Ex: Evento XP Investimentos">
                </div>
                <div class="input-group">
                    <label>Valor Estimado (R$)</label>
                    <input type="number" id="dealValue" class="form-control" placeholder="0.00" step="0.01" min="0">
                </div>
                <div class="input-group">
                    <label>Fase</label>
                    <select id="dealStatus" class="form-control">
                        <option value="Prospecção">Prospecção</option>
                        <option value="Qualificação">Qualificação</option>
                        <option value="Proposta">Proposta Enviada</option>
                        <option value="Negociação">Negociação</option>
                        <option value="Fechado">Fechado / Ganho</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Responsável</label>
                    <input type="text" id="dealOwner" class="form-control" placeholder="Nome do responsável">
                </div>
                <div class="input-group">
                    <label>Observações</label>
                    <textarea id="dealObs" class="form-control" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="btnCancel" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="autoupdate.js"></script>
    <script src="auth-guard.js"></script>
    <script type="module" src="crm.js"></script>
</body>
</html>
